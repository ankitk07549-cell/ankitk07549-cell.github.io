<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;

      background-image:
        linear-gradient(rgba(0,0,0,0.10), rgba(0,0,0,0.10)),
        url("file_000000006be0820894363ef68bddc9bd.png");

      background-size: cover;
      background-position: center top;
      background-attachment: fixed;

      min-height: 100vh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 45px 5%;
    }

    h1 {
      font-size: clamp(55px, 9vw, 110px);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 10px;
      color: white;
    }

    .welcome {
      font-size: clamp(28px, 4.5vw, 58px);
      font-weight: 800;
      margin-bottom: 12px;
      color: white;
    }

    .instagram {
      font-size: clamp(24px, 3.8vw, 48px);
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      color: white;
    }

    .instagram a {
      color: white;
      text-decoration: underline;
      word-break: break-all;
    }

    .date-title {
      font-size: clamp(28px, 4vw, 50px);
      font-weight: 800;
      margin-bottom: 12px;
      color: white;
    }

    .date-sheet {
      width: min(650px, 100%);
      border-radius: 28px;
      border: 4px solid white;
      display: block;
      margin-bottom: 45px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    .apps {
      display: flex;
      gap: 45px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .app-card {
      width: 290px;
      text-align: center;
    }

    .app-image {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 35px;
      display: block;
      margin: 0 auto 8px;
      border: 3px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    .app-name {
      background: #07172e;
      color: white;
      font-size: 24px;
      font-weight: 800;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .download-btn {
      display: block;
      background: #087cf5;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      padding: 13px 15px;
      border-radius: 30px;
      border: 2px solid white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .download-btn:hover {
      background: #005fc7;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 18px;
      }

      .apps {
        gap: 30px;
        justify-content: center;
      }

      .app-card {
        width: 260px;
      }

      .date-sheet {
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <h1>Hello Sir</h1>

    <div class="welcome">
      Welcome to my website
    </div>

    <div class="instagram">
      <span>My Instagram Link</span>

      <a
        href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=s7inj8z"
        target="_blank">
        https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=s7inj8z
      </a>
    </div>

    <div class="date-title">
      Date Sheet
    </div>

    <!-- Date Sheet: click करके बड़ी/zoom view में खुलेगी -->
    <a href="IMG-20260925-WA0016.jpg" target="_blank">
      <img
        src="IMG-20260925-WA0016.jpg"
        alt="Date Sheet"
        class="date-sheet">
    </a>

    <div class="apps">

      <!-- VN PREMIUM -->
      <div class="app-card">

        <img
          src="Screenshot_20260926_210400.jpg"
          alt="VN Premium"
          class="app-image">

        <div class="app-name">
          VN Premium
        </div>

        <a
          href="VN Primium@Gomod1.apk"
          download
          class="download-btn">
          ⬇ Click to Download
        </a>

      </div>

      <!-- TRIO APP -->
      <div class="app-card">

        <img
          src="Screenshot_20260926_210503.jpg"
          alt="fampay App"
          class="app-image">

        <div class="app-name">
          Trio App
        </div>

        <a
          href="fampay App.apk"
          download
          class="download-btn">
          ⬇ Click to Download
        </a>

      </div>

    </div>

  </div>

</body>
</html>
