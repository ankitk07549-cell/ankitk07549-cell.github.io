<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>मेरी वेबसाइट</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #000;
      min-height: 100vh;
      background: url("background.jpg") center center / cover fixed no-repeat;
    }

    .page {
      min-height: 100vh;
      padding: 35px 5%;
    }

    h1 {
      font-size: clamp(55px, 8vw, 110px);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 12px;
    }

    .welcome {
      font-size: clamp(32px, 5vw, 62px);
      font-weight: 800;
      margin-bottom: 22px;
    }

    .instagram {
      font-size: clamp(25px, 3.5vw, 42px);
      font-weight: 800;
      margin-bottom: 48px;
    }

    .instagram a {
      color: #0645ff;
      text-decoration: underline;
      word-break: break-all;
    }

    .date-title {
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .top-photos {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .date-photo,
    .extra-photo {
      width: min(100%, 610px);
      border: 3px solid white;
      border-radius: 25px;
      display: block;
      box-shadow: 0 5px 18px rgba(0,0,0,0.25);
    }

    .apps {
      display: flex;
      gap: 70px;
      flex-wrap: wrap;
      margin-top: 58px;
      padding-left: 20px;
    }

    .app {
      width: 300px;
      text-align: center;
    }

    .app img {
      width: 205px;
      height: 205px;
      object-fit: cover;
      border-radius: 38px;
      border: 3px solid white;
      display: block;
      margin: 0 auto 7px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.35);
    }

    .app-name {
      background: #07192f;
      color: white;
      border-radius: 12px;
      padding: 9px 8px;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .download {
      display: block;
      background: #1267e8;
      color: white;
      text-decoration: none;
      border: 2px solid white;
      border-radius: 30px;
      padding: 12px 18px;
      font-size: 20px;
      font-weight: 800;
    }

    @media (max-width: 700px) {
      .page {
        padding: 25px 18px;
      }

      .apps {
        gap: 35px;
        justify-content: center;
        padding-left: 0;
      }

      .app {
        width: min(300px, 90vw);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>Hello Sir</h1>

    <div class="welcome">
      Welcome to my website
    </div>

    <div class="instagram">
      My Instagram
      <a href="YOUR_INSTAGRAM_LINK" target="_blank">
        Link
      </a>
    </div>

    <div class="date-title">
      Date Sheet
    </div>

    <div class="top-photos">
      <img class="date-photo" src="datesheet.jpg" alt="Date Sheet">
      <img class="extra-photo" src="extra.jpg" alt="Photo">
    </div>

    <section class="apps">

      <div class="app">
        <img src="vn.jpg" alt="VN Premium">

        <div class="app-name">
          VN Premium
        </div>

        <a class="download"
           href="VN Primium@Gomod1.apk"
           download>
          ⬇️ Click to Download
        </a>
      </div>


      <div class="app">
        <img src="fampay.jpg" alt="Fampay Pro">

        <div class="app-name">
          Fampay Pro
        </div>

        <a class="download"
           href="Fampay Pro@GOMOD1.apk"
           download>
          ⬇️ Click to Download
        </a>
      </div>

    </section>

  </main>

</body>
</html>
