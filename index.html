<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>मेरी वेबसाइट</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("hd-satoru-gojo-wallpaper-with-fire-and-blue-sparks-sr07052610-cover.webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 25px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Ankit Kumar</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>स्वागत है मेरी वेबसाइट पर</h1>

    <p>यह मेरी अपनी वेबसाइट है 🚀</p>

    <a href="#" class="button">शुरू करें</a>
  </section>

  <footer>
    © 2026 Ankit Kumar
  </footer>

</body>
</html>
