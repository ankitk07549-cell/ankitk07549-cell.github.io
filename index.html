
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: white;
      background: #07172e;
    }

    /* PASSWORD LOCK SCREEN */
    #lockScreen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #07172e, #123d70);
    }

    .lock-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid #ffffff55;
      border-radius: 20px;
      background: #ffffff12;
      box-shadow: 0 10px 35px #0005;
    }

    .lock-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .lock-box h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .lock-box p {
      margin-bottom: 20px;
      color: #e0eaff;
    }

    #passwordInput {
      width: 100%;
      padding: 14px;
      border: 2px solid #ffffff55;
      border-radius: 10px;
      font-size: 17px;
      margin-bottom: 14px;
      outline: none;
    }

    #unlockButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #087cf5;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #errorMessage {
      color: #ffb4b4;
      margin-top: 14px;
      min-height: 20px;
    }

    /* WEBSITE CONTENT */
    #websiteContent {
      display: none;
    }

    body.unlocked {
      background: #07172e;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 45px 5%;
      background-image:
        linear-gradient(rgba(0,0,0,0.10), rgba(0,0,0,0.10)),
        url("file_000000006be0820894363ef68bddc9bd.png");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
    }

    h1 {
      font-size: clamp(55px, 9vw, 110px);
      font-weight: 900;
      line-height: 0.95;
      margin-bottom: 10px;
      color: white;
    }

    .welcome {
      font-size: clamp(28px, 4.5vw, 58px);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .instagram {
      font-size: clamp(20px, 3.8vw, 35px);
      font-weight: 800;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
    }

    .instagram a {
      color: white;
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .date-title {
      font-size: clamp(28px, 4vw, 50px);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .My-girl-friend {
      width: min(650px, 100%);
      border-radius: 28px;
      border: 4px solid white;
      display: block;
      margin-bottom: 45px;
      box-shadow: 0 8px 25px #0006;
      cursor: pointer;
    }

    .apps {
      display: flex;
      gap: 45px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .app-card {
      width: 290px;
      text-align: center;
    }

    .app-image {
      width: 230px;
      height: 230px;
      object-fit: cover;
      border-radius: 35px;
      display: block;
      margin: 0 auto 8px;
      border: 3px solid white;
      box-shadow: 0 8px 20px #0006;
    }

    .app-name {
      background: #07172e;
      color: white;
      font-size: 24px;
      font-weight: 800;
      padding: 9px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .download-btn {
      display: block;
      background: #087cf5;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      padding: 13px 15px;
      border-radius: 30px;
      border: 2px solid white;
      box-shadow: 0 5px 15px #0005;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 18px;
      }

      .apps {
        gap: 30px;
        justify-content: center;
      }

      .app-card {
        width: 260px;
      }

      .My-girl-friend {
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- PASSWORD SCREEN -->
  <div id="lockScreen">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h2>Website Locked</h2>
      <p>Enter password to open this website</p>

      <form id="unlockForm">
        <input
          type="password"
          id="passwordInput"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button id="unlockButton" type="submit">
          🔓 Unlock Website
        </button>
      </form>

      <div id="errorMessage" role="alert"></div>
    </div>
  </div>

  <!-- YOUR WEBSITE -->
  <div id="websiteContent">
    <div class="page">

      <h1>Hello Sir</h1>

      <div class="welcome">
        Welcome to my website
      </div>

      <div class="instagram">
        <span>My Instagram Link</span>
        <a
          href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&amp;utm_medium=copy_link&amp;utm_content=s7inj8z"
          target="_blank"
          rel="noopener noreferrer">
          Open Instagram
        </a>
      </div>

      <div class="date-title">My girl friend</div>

      <a href="IMG_20261017_002752.jpg" target="_blank">
        <img
          src="IMG_20261017_002752.jpg"
          alt="My girl friend"
          class="My-girl-friend">
      </a>

      <div class="apps">

        <div class="app-card">
          <img
            src="Screenshot_20260926_210400.jpg"
            alt="VN Premium"
            class="app-image">

          <div class="app-name">VN Premium</div>

          <a
            href="VN Primium@Gomod1.apk"
            download
            class="download-btn">
            ⬇ Click to Download
          </a>
        </div>

        <div class="app-card">
          <img
            src="Screenshot_20260926_210503.jpg"
            alt="fampay App"
            class="app-image">

          <div class="app-name">fampay primium App</div>

          <a
            href="fampay App.apk"
            download
            class="download-btn">
            ⬇ Click to Download
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Apna password neeche wali line mein likho.
    const correctPassword = "YAHAN_APNA_PASSWORD_LIKHO";

    const form = document.getElementById("unlockForm");
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("errorMessage");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (input.value === correctPassword) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("websiteContent").style.display = "block";
        document.body.classList.add("unlocked");
      } else {
        error.textContent = "Wrong password! Try again.";
        input.value = "";
        input.focus();
      }
    });
  </script>

</body>
</html>
